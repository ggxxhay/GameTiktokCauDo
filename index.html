<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Ai Là Triệu Phú - TikTok Live</title>
  <style>
    :root{--bg:#090d24;--card:#131b47;--gold:#f5b942;--blue:#2345a8;--green:#1fa855;--red:#d9383a}
    *{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif}
    body{background:#000;display:flex;justify-content:center;align-items:center;min-height:100vh;color:#fff;overflow-x:hidden}
    .live-container{width:100vw;max-width:500px;height:100vh;max-height:900px;background:radial-gradient(circle at top,#1b286b 0%,var(--bg) 80%);border:2px solid #2a398a;display:flex;flex-direction:column;justify-content:space-between;padding:12px;position:relative}
    .start-screen{position:absolute;inset:0;background:rgba(9,13,36,.95);z-index:50;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:20px;text-align:center}
    .start-screen h1{color:var(--gold);font-size:24px;margin-bottom:10px;text-transform:uppercase;text-shadow:0 0 10px rgba(245,185,66,.5)}
    .start-screen p{font-size:13px;color:#a5b4fc;margin-bottom:20px;line-height:1.4}
    button{cursor:pointer}
    .btn-start{background:linear-gradient(180deg,#f5b942,#d48806);color:#000;border:0;padding:12px 30px;border-radius:30px;font-size:16px;font-weight:800;box-shadow:0 4px 15px rgba(245,185,66,.4)}
    .btn-start:active{transform:scale(.95)}
    .header{display:flex;justify-content:space-between;align-items:center;background:rgba(0,0,0,.4);padding:4px 10px;border-radius:20px;border:1px solid rgba(245,185,66,.4)}
    .status-dot{height:8px;width:8px;background:#ff9800;border-radius:50%;display:inline-block;margin-right:4px}
    .status-dot.connected{background:#00e676;box-shadow:0 0 6px #00e676}
    .btn-config{background:var(--gold);color:#000;border:0;padding:4px 8px;border-radius:10px;font-weight:bold;font-size:11px}
    .leaderboard{background:rgba(19,27,71,.85);border:1px solid var(--gold);border-radius:10px;padding:6px;margin-top:4px}
    .leaderboard h3{font-size:11px;text-align:center;color:var(--gold);margin-bottom:2px;text-transform:uppercase}
    .top-list{display:flex;justify-content:space-around;font-size:10px;gap:4px}
    .top-item{text-align:center;background:rgba(255,255,255,.08);padding:3px 4px;border-radius:6px;width:33%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .top-item span{display:block;font-weight:bold;color:#ffd54f;font-size:12px}
    .timer-section{text-align:center;margin:4px 0}
    .question-badge{background:var(--gold);color:#000;padding:2px 10px;border-radius:12px;font-weight:800;font-size:11px;display:inline-block;margin-bottom:2px}
    .timer-circle{width:38px;height:38px;border-radius:50%;border:2px solid var(--gold);display:flex;justify-content:center;align-items:center;margin:0 auto;font-size:15px;font-weight:bold;background:var(--card)}
    .question-box{background:linear-gradient(180deg,#1a2766,#0e153d);border:2px solid var(--gold);border-radius:12px;padding:10px;text-align:center;font-size:14px;font-weight:600;line-height:1.25;min-height:70px;display:flex;align-items:center;justify-content:center}
    .options-grid{display:flex;flex-direction:column;gap:6px;margin:6px 0}
    .option-btn{position:relative;background:var(--card);border:2px solid #3c54b8;border-radius:18px;padding:8px 12px;color:#fff;font-size:13px;font-weight:600;text-align:left;overflow:hidden;display:flex;justify-content:space-between;align-items:center;min-height:38px}
    .prefix{color:var(--gold);font-weight:800;margin-right:6px}
    .vote-bar{position:absolute;inset:0 auto 0 0;width:0;background:rgba(245,185,66,.25);z-index:0;transition:width .3s ease}
    .option-content,.vote-percent{position:relative;z-index:1}.vote-percent{font-size:11px;color:#ffd54f;font-weight:bold}
    .option-btn.correct{background:var(--green)!important;border-color:#72ffab!important}.option-btn.wrong{background:var(--red)!important;border-color:#ff8a8a!important;opacity:.7}
    .ticker{text-align:center;font-size:11px;color:#a5b4fc;height:16px;overflow:hidden;margin-bottom:2px}
    .sim-bar{display:flex;gap:4px;background:rgba(255,255,255,.1);padding:4px;border-radius:8px}
    .sim-bar input{flex:1;min-width:0;background:var(--bg);border:1px solid #3c54b8;color:#fff;padding:4px 8px;border-radius:6px;font-size:11px}
    .sim-bar button{background:var(--blue);color:#fff;border:0;padding:4px 10px;border-radius:6px;font-weight:bold;font-size:11px}
    .modal{display:none;position:absolute;inset:0;background:rgba(0,0,0,.85);z-index:100;justify-content:center;align-items:center;padding:15px}
    .modal-content{background:var(--card);border:2px solid var(--gold);border-radius:14px;padding:15px;width:100%;max-width:400px}
    .modal-content h2{font-size:15px;color:var(--gold);margin-bottom:8px}.modal-content label{display:block;font-size:10px;margin-bottom:2px;color:#ccc}
    .modal-content input{width:100%;padding:6px;margin-bottom:8px;border-radius:6px;border:1px solid #3c54b8;background:var(--bg);color:#fff;font-size:12px}
    .modal-actions{display:flex;gap:6px;justify-content:flex-end}
  </style>
</head>
<body>
  <main class="live-container" id="liveContainer">
    <section class="start-screen" id="startScreen">
      <h1>🌟 Ai Là Triệu Phú</h1>
      <p>Phiên bản tương tác TikTok Live.<br>Hỗ trợ hiển thị ở cả chế độ dọc và ngang!</p>
      <button class="btn-start" id="startButton" type="button">BẮT ĐẦU CHƠI</button>
    </section>
    <div>
      <div class="header"><div><span id="statusDot" class="status-dot"></span><span id="statusText" style="font-size:10px;font-weight:bold">Chế độ Chạy Thử</span></div><button class="btn-config" id="configButton" type="button">⚙️ Kết nối Live</button></div>
      <section class="leaderboard"><h3>🏆 Top Thông Thái</h3><div class="top-list" id="topList"><div class="top-item">Chưa có<span>0 đ</span></div><div class="top-item">Chưa có<span>0 đ</span></div><div class="top-item">Chưa có<span>0 đ</span></div></div></section>
    </div>
    <section>
      <div class="timer-section"><div class="question-badge" id="qNumber">CÂU 1 / 10</div><div class="timer-circle" id="timer">20</div></div>
      <div class="question-box" id="questionText">Nhấn "Bắt đầu chơi" để load câu hỏi...</div>
      <div class="options-grid" id="optionsGrid"></div>
    </section>
    <div><div class="ticker" id="ticker">👉 Gõ A, B, C hoặc D ở ô dưới để test thử!</div><div class="sim-bar" id="simBar"><input type="text" id="simInput" placeholder="Gõ A, B, C, D..." maxlength="10"><button id="sendButton" type="button">Gửi</button></div></div>
    <div class="modal" id="configModal"><div class="modal-content"><h2>Kết nối TikTok Live</h2><label for="ttUser">TikTok Username (không cần @):</label><input type="text" id="ttUser" placeholder="ví dụ: user12345"><label for="ttApiKey">EulerStream API Key:</label><input type="password" id="ttApiKey" placeholder="Dán API Key vào đây..." autocomplete="off"><div class="modal-actions"><button class="btn-config" id="closeModalButton" type="button" style="background:#555;color:#fff">Đóng</button><button class="btn-config" id="connectButton" type="button">Kết nối ngay</button></div></div></div>
  </main>
<script>
'use strict';
const questions = [
  {q:'Đâu là tên một loại bánh truyền thống nổi tiếng của Việt Nam dịp Tết?',A:'Bánh Tét',B:'Bánh Mì',C:'Bánh Xèo',D:'Bánh Cuốn',ans:'A'},
  {q:'Con vật nào sau đây không nằm trong 12 con giáp của Việt Nam?',A:'Con Mèo',B:'Con Trâu',C:'Con Thỏ',D:'Con Rồng',ans:'C'},
  {q:"Đỉnh núi nào được mệnh danh là 'Nóc nhà Đông Dương'?",A:'Bà Đen',B:'Fansipan',C:'Langbiang',D:'Bạch Mã',ans:'B'},
  {q:"Câu tục ngữ: 'Gần mực thì đen, gần đèn thì...' gì?",A:'Chói',B:'Nóng',C:'Sáng',D:'Rạng',ans:'C'},
  {q:'Loại quả nào thường được dùng để nấu canh chua miền Nam?',A:'Quả Me',B:'Quả Sấu',C:'Quả Chanh',D:'Quả Khế',ans:'A'},
  {q:'Ai là người lãnh đạo cuộc khởi nghĩa Lam Sơn chống quân Minh?',A:'Quang Trung',B:'Trần Hưng Đạo',C:'Lê Lợi',D:'Lý Thường Kiệt',ans:'C'},
  {q:'Đơn vị tiền tệ chính thức của Nhật Bản là gì?',A:'Won',B:'Nhân dân tệ',C:'Baht',D:'Yên',ans:'D'},
  {q:'Hành tinh nào gần Mặt Trời nhất trong Hệ Mặt Trời?',A:'Sao Kim',B:'Sao Thủy',C:'Sao Hỏa',D:'Trái Đất',ans:'B'},
  {q:'Vịnh Hạ Long thuộc tỉnh nào của nước ta?',A:'Hải Phòng',B:'Thanh Hóa',C:'Quảng Ninh',D:'Nghệ An',ans:'C'},
  {q:"Từ nào còn thiếu: 'Có công mài sắt, có ngày nên...' ?",A:'Kim',B:'Dao',C:'Kéo',D:'Kiếm',ans:'A'}
];
let currentIdx=0,timeLeft=20,timerInterval=null,nextQuestionTimeout=null,isAcceptingAnswers=false,currentVotes={},scores={},ws=null;
const $=id=>document.getElementById(id);
function startGame(){
  $('startScreen').style.display='none';
  currentIdx=0; scores={}; updateLeaderboard(); loadQuestion();
}
function loadQuestion(){
  if(currentIdx>=questions.length) currentIdx=0;
  const item=questions[currentIdx];
  $('qNumber').textContent=`CÂU ${currentIdx+1} / ${questions.length}`;
  $('questionText').textContent=item.q;
  const grid=$('optionsGrid'); grid.replaceChildren();
  ['A','B','C','D'].forEach(opt=>{
    const row=document.createElement('div'); row.className='option-btn'; row.id=`opt-${opt}`;
    const bar=document.createElement('div'); bar.className='vote-bar'; bar.id=`bar-${opt}`;
    const content=document.createElement('div'); content.className='option-content';
    const prefix=document.createElement('span'); prefix.className='prefix'; prefix.textContent=`${opt}:`;
    const answer=document.createElement('span'); answer.textContent=item[opt]; content.append(prefix,answer);
    const pct=document.createElement('div'); pct.className='vote-percent'; pct.id=`pct-${opt}`; pct.textContent='0%';
    row.append(bar,content,pct); grid.append(row);
  });
  currentVotes={}; isAcceptingAnswers=true; timeLeft=20; $('timer').textContent=timeLeft;
  $('ticker').textContent='👉 Gõ A, B, C hoặc D ở dưới để test thử!';
  clearInterval(timerInterval); clearTimeout(nextQuestionTimeout);
  timerInterval=setInterval(()=>{timeLeft--; $('timer').textContent=timeLeft; if(timeLeft<=0){clearInterval(timerInterval); revealAnswer();}},1000);
}
function handleIncomingComment(userId,nickname,text){
  if(!isAcceptingAnswers||typeof text!=='string') return;
  const clean=text.trim().toUpperCase();
  const choice=['A','B','C','D'].includes(clean)?clean:(clean.length&&['A','B','C','D'].includes(clean[0])?clean[0]:null);
  if(!choice) return;
  currentVotes[userId]={name:nickname,choice}; $('ticker').textContent=`💬 ${nickname} chọn: ${choice}`; updateVoteBars();
}
function updateVoteBars(){
  const counts={A:0,B:0,C:0,D:0}; let total=0;
  Object.values(currentVotes).forEach(v=>{counts[v.choice]++;total++;});
  ['A','B','C','D'].forEach(opt=>{const pct=total?Math.round(counts[opt]/total*100):0;$(`bar-${opt}`).style.width=`${pct}%`;$(`pct-${opt}`).textContent=`${pct}%`;});
}
function revealAnswer(){
  isAcceptingAnswers=false; const correctOpt=questions[currentIdx].ans;
  ['A','B','C','D'].forEach(opt=>$(`opt-${opt}`).classList.add(opt===correctOpt?'correct':'wrong'));
  let winners=0;
  Object.entries(currentVotes).forEach(([uid,data])=>{if(data.choice===correctOpt){winners++;if(!scores[uid])scores[uid]={name:data.name,score:0};scores[uid].score+=10;}});
  $('ticker').textContent=`🎉 Đáp án đúng: ${correctOpt} (${winners} bạn đúng +10đ)`; updateLeaderboard();
  nextQuestionTimeout=setTimeout(()=>{currentIdx++;loadQuestion();},4000);
}
function updateLeaderboard(){
  const sorted=Object.values(scores).sort((a,b)=>b.score-a.score).slice(0,3), medals=['🥇','🥈','🥉'], list=$('topList'); list.replaceChildren();
  for(let i=0;i<3;i++){const item=document.createElement('div');item.className='top-item';item.append(document.createTextNode(`${medals[i]} ${sorted[i]?.name||'Trống'}`));const score=document.createElement('span');score.textContent=`${sorted[i]?.score||0}đ`;item.append(score);list.append(item);}
}
function simulateChat(){const input=$('simInput');if(!input.value.trim())return;const names=['Minh Anh','Tuấn Kiệt','Hoàng Nam','Bảo Ngọc','Bạn (Test)'];const name=names[Math.floor(Math.random()*names.length)];handleIncomingComment(name,name,input.value);input.value='';}
function openModal(){$('configModal').style.display='flex';}
function closeModal(){$('configModal').style.display='none';}
function connectTikTok(){
  const user=$('ttUser').value.trim(),apiKey=$('ttApiKey').value.trim();
  if(!user||!apiKey){alert('Vui lòng nhập đầy đủ Username và API Key!');return;}
  if(ws)ws.close(); closeModal(); $('statusText').textContent='Đang kết nối...';
  try{ws=new WebSocket(`wss://ws.eulerstream.com?uniqueId=${encodeURIComponent(user)}&apiKey=${encodeURIComponent(apiKey)}`);}
  catch(error){$('statusText').textContent='Không thể kết nối';return;}
  ws.onopen=()=>{$('statusDot').classList.add('connected');$('statusText').textContent=`Live: @${user}`;$('simBar').style.display='none';};
  ws.onmessage=event=>{
    try{const data=JSON.parse(event.data);const comment=data.comment||data.text||data.message;const userData=data.user||{};if(typeof comment==='string')handleIncomingComment(userData.id||data.userId||userData.uniqueId||'viewer',userData.nickname||userData.uniqueId||data.nickname||'Viewer',comment);}
    catch(error){console.warn('Không đọc được tin nhắn TikTok Live:',error);}
  };
  ws.onerror=()=>{$('statusText').textContent='Lỗi kết nối Live';};
  ws.onclose=()=>{$('statusDot').classList.remove('connected');$('statusText').textContent='Đã ngắt kết nối';$('simBar').style.display='flex';};
}
$('startButton').addEventListener('click',startGame);
$('configButton').addEventListener('click',openModal);
$('closeModalButton').addEventListener('click',closeModal);
$('connectButton').addEventListener('click',connectTikTok);
$('sendButton').addEventListener('click',simulateChat);
$('simInput').addEventListener('keydown',event=>{if(event.key==='Enter')simulateChat();});
</script>
</body>
</html>
